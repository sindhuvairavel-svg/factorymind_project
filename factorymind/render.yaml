services:
  - type: web
    name: factorymind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python -m ml.simulate_data && python -m ml.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
